<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEVAN · Pregled portfolija</title><style>
body{margin:0;font:15px system-ui,Arial;background:#f2f5f8;color:#173047}main{max-width:1250px;margin:0;padding:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.card{background:white;border:1px solid #dbe4ec;border-radius:12px;padding:18px;margin:12px 0}.number{font-size:30px;font-weight:700}.muted{color:#566b7c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,input,button{padding:10px;border:1px solid #b7c9d6;border-radius:7px;font:inherit}button{background:#17658d;color:white;cursor:pointer}a{color:#17658d}.project h3{margin:0 0 7px}.flag{color:#a34411;font-weight:600}.error{color:#a42121}@media(max-width:700px){.grid{display:block}}
</style><!--MEVAN_NAV_CSS--></head><body><!--MEVAN_SHELL_START--><main><h1 class="mv-title">Pregled portfolija</h1><p class="mv-lead">Pregled projekata prijavljenog konsultanta. Procjene i potvrde nisu nezavisno verificirani rezultati.</p><div id="error" role="alert"></div><section class="stats" id="stats"></section><div class="card grid"><div><label for="company">Kompanija</label><br><select id="company"><option value="">Sve kompanije</option></select></div><div><label for="status">Status</label><br><select id="status"><option value="">Svi statusi</option><option value="draft">Nacrt</option><option value="validation">Validacija</option><option value="implementation">Implementacija</option><option value="closed">Zatvoreno</option></select></div></div><div id="projects" aria-live="polite" translate="no"></div><p class="muted" id="disclaimer"></p></main><script>
let data=[];const el=id=>document.getElementById(id);const statusNames={draft:'Nacrt',validation:'Validacija',implementation:'Implementacija',closed:'Zatvoreno'};
function render(){const filtered=data.filter(p=>(!el('company').value||p.company_id===el('company').value)&&(!el('status').value||p.status===el('status').value));const cards=[['Kompanije',new Set(filtered.map(x=>x.company_id)).size],['Projekti',filtered.length],['U implementaciji',filtered.filter(x=>x.status==='implementation').length],['S potencijalno zakašnjelim rokovima',filtered.filter(x=>x.overdue_activities.length).length]];el('stats').replaceChildren();for(const [label,n] of cards){const c=document.createElement('div');c.className='card';const a=document.createElement('div');a.className='number';a.textContent=n;const b=document.createElement('div');b.textContent=label;c.append(a,b);el('stats').append(c)}el('projects').replaceChildren();if(!filtered.length){const p=document.createElement('p');p.textContent='Nema projekata za odabrani filter.';el('projects').append(p)}for(const p of filtered){const card=document.createElement('article');card.className='card project';const h=document.createElement('h3');h.textContent=p.title;const sub=document.createElement('p');sub.className='muted';sub.textContent=p.company_id+' · '+(statusNames[p.status]||p.status);const metrics=document.createElement('p');metrics.textContent='Aktivnosti: '+p.activities_count+' · KPI: '+p.kpis_count+' · Sedmični pregledi: '+p.weekly_reviews_count+' · Zadnja sedmica: '+(p.last_week||'nema')+' · Finansijski model: '+(p.financial_model_present?'da':'ne');const effects=document.createElement('p');effects.textContent='Evidentirani efekti: '+p.actual_entries_count+' · Konsultantski potvrđeni unosi: '+p.consultant_confirmed_entries_count+' · Nezavisno verificirani: 0';const due=document.createElement('p');due.className='flag';due.textContent=p.overdue_activities.length?'Potencijalno prekoračeni rokovi: '+p.overdue_activities.map(a=>a.title+' ('+a.due_date+')').join(', '):'Nema datuma aktivnosti u prošlosti';const link=document.createElement('a');link.href='/projects-ui';link.textContent='Otvori projektni modul';card.append(h,sub,metrics,effects,due,link);el('projects').append(card)}}
async function load(){try{const r=await fetch('/api/v4/dashboard',{credentials:'same-origin'});if(!r.ok)throw Error('Nije moguće učitati portfolio (HTTP '+r.status+')');const result=await r.json();data=result.projects||[];el('disclaimer').textContent=result.disclaimer;for(const company of [...new Set(data.map(p=>p.company_id))].sort()){const option=document.createElement('option');option.value=company;option.textContent=company;el('company').append(option)}render()}catch(e){el('error').className='error';el('error').textContent=e.message}}el('company').addEventListener('change',render);el('status').addEventListener('change',render);load();
</script><!--MEVAN_SHELL_END--></body></html>
