 for(const [x,y,topic] of ASSESSMENT_LINKS){
  const cx=CRITERIA.find(c=>c.code===x),cy=CRITERIA.find(c=>c.code===y);
  if(!cx||!cy)continue;
  const a=get(cx),b=get(cy);
  if(a.applicable==='no'||b.applicable==='no'||a.score===''||b.score===''||a.score===undefined||b.score===undefined)continue;
  if(Math.abs(Number(a.score)-Number(b.score))>=3)out.push(`${topic}: ${x}=${a.score}/5 i ${y}=${b.score}/5. Provjerite različit opseg ili period; ovo nije automatski dokaz greške.`);
 }
 return out;
}
function assessmentQuality(){
 const missing=CRITERIA.filter(c=>get(c).applicable!=='no'&&!valid(c));
 const na=CRITERIA.filter(c=>get(c).applicable==='no'&&!naValid(get(c)));
 const contradictions=crossChecks();
 return {missing,na,contradictions};
}
function qualityPanel(){
 const q=assessmentQuality();
 return `<div class="panel"><h2>Kontrola kvaliteta unosa</h2><p class="muted">Upozorenja ne mijenjaju ocjene. Status „Potvrđeno“ je oznaka unosa konsultanta, a ne nezavisna verifikacija.</p><p><strong>${q.missing.length}</strong> kriterija bez potpune ocjene/dokaza · <strong>${q.na.length}</strong> N/P bez obrazloženja · <strong>${q.contradictions.length}</strong> mogućih neslaganja</p>${q.contradictions.map(x=>`<p class="warning">${esc(x)}</p>`).join('')}${q.na.map(c=>`<p class="warning">${esc(c.code)}: navedite razlog za Nije primjenjivo.</p>`).join('')}${q.missing.length?`<details><summary>Prikaži kriterije koje treba provjeriti (${q.missing.length})</summary><p>${q.missing.map(c=>esc(c.code+' · '+c.name)).join('; ')}</p></details>`:''}</div>`;
}

const get=c=>state.assess[c.code]||{};
const valid=c=>{let a=get(c);return a.applicable!=='no'&&a.proof==='confirmed'&&Boolean(String(a.evidence||'').trim())&&a.score!==undefined&&a.score!==null&&a.score!==''&&Number.isInteger(Number(a.score))&&Number(a.score)>=0&&Number(a.score)<=5};
const applicable=c=>get(c).applicable!=='no';
const naValid=a=>{const reason=String(a.na_reason||a.evidence||'').trim(),words=reason.toLocaleLowerCase('bs').match(/\p{L}+/gu)||[];return reason.length>=20&&words.length>=4&&new Set(words).size>=3&&!words.every(w=>['test','razlog','x','todo','tekst','naknadno'].includes(w))&&String(a.na_approved_by||'').trim().length>=2};
const summary=arr=>{let a=arr.filter(applicable),v=a.filter(valid),avg=v.length?v.reduce((s,c)=>s+Number(get(c).score),0)/v.length*20:null;return {total:arr.length,app:a.length,valid:v.length,avg,done:a.length>0&&v.length===a.length&&arr.every(c=>get(c).applicable!=='no'||naValid(get(c)))}};

l (KM)</label><input type="number" min="0" data-effect="${i}" data-field="annual" value="${Number(x.annual)||0}"></div><div><label>Jednokratni efekat (KM)</label><input type="number" min="0" data-effect="${i}" data-field="oneoff" value="${Number(x.oneoff)||0}"></div><div><label>Status</label><select data-effect="${i}" data-field="status"><option value="hypothesis" ${x.status==='hypothesis'?'selected':''}>Hipoteza / nepotvrđeno</option><option value="review" ${x.status==='review'?'selected':''}>U provjeri</option><option value="verified" ${x.status==='verified'?'selected':''}>Stručno potvrđeno</option></select></div><div><label>Preklapanje sa ID nalaza</label><input data-effect="${i}" data-field="overlap" value="${esc(x.overlap||'')}" placeholder="npr. loss2"></div></div><div class="two"><div><label>Osnovica (broj)</label><input type="number" step="any" data-effect="${i}" data-field="baseline" value="${esc(x.baseline??'')}" placeholder="npr. 120"></div><div><label>Ciljna vrijednost (broj)</label><input type="number" step="any" data-effect="${i}" data-field="target" value="${esc(x.target??'')}"></div><div><label>Vrijednost po jedinici (KM)</label><input type="number" step="any" data-effect="${i}" data-field="unit_value" value="${esc(x.unit_value??'')}"></div><div><label>Period i izvor osnovice</label><input data-effect="${i}" data-field="period" value="${esc(x.period||'')}" placeholder="npr. 01–10/2026"></div></div><label>Dokaz / pretpostavka</label><textarea rows="2" data-effect="${i}" data-field="evidence">${esc(x.evidence||'')}</textarea><p class="muted">ID: ${esc(x.id)} · ${x.overlap?'UPOZORENJE: potencijalno dvostruko računanje':'Bez označenog preklapanja'}</p><button class="btn danger small" onclick="removeEffect(${i})">Ukloni</button></div></details>`).join('')}`}


// Lokalni demonstracijski analitički mehanizam. Nije povezan s AI servisom.
function draftAnalysis(dim){
 const arr=dim==='ALL'?CRITERIA:CRITERIA.filter(c=>c.dim===dim);
 const s=summary(arr),weak=arr.filter(c=>{const a=get(c);return a.applicable!=='no'&&a.proof==='confirmed'&&a.score!==''&&Number(a.score)<=2}).sort((a,b)=>Number(get(a).score)-Number(get(b).score)).slice(0,5);
 const unresolved=arr.filter(c=>{const a=get(c);return a.applicable!=='no'&&(a.proof!=='confirmed'||a.score==='')}).length;
 const parts=['AUTOMATSKI NACRT – DEMONSTRACIJSKA ANALIZA (nije generativni AI).',
 'Obuhvat: '+s.valid+'/'+s.app+' primjenjivih kriterija; indeks '+fmt(s.avg)+'/100.',
 unresolved?'Nepotpuno: '+unresolved+' kriterija bez potvrđene procjene.':'Svi primjenjivi kriteriji su ocijenjeni prema označenom statusu dokaza.',
 weak.length?'Prioriteti za stručnu provjeru: '+weak.map(c=>c.code+' '+c.name+' ('+get(c).score+'/5)').join('; ')+'.':'Nema kriterija s ocjenom 0–2 među potvrđenim unosima.',
 'Preporuka: provjeriti izvore podataka, finansijske pretpostavke i moguće preklapanje koristi prije zaključivanja.',
 'NAPOMENA: METALPRO je simulacija; ovaj nacrt ne potvrđuje stvarne nalaze.'];
 return parts.join('\n\n');
}
function reviewRecord(dim){const d=activeDiagnostic();if(!d.review)d.review={};if(!d.review[dim])d.review[dim]={draft:'',edited:'',status:'draft',reviewer:'',date:'',fingerprint:''};return d.review[dim]}
function reviewFingerprint(dim){const arr=dim==='ALL'?CRITERIA:CRITERIA.filter(c=>c.dim===dim);return JSON.stringify(arr.map(c=>get(c)))+JSON.stringify(effects())+JSON.stringify(reviewRecord(dim).edited||'')}
function makeDraft(dim){let r=reviewRecord(dim);r.draft=draftAnalysis(dim);r.edited=r.draft;r.status='draft';r.reviewer='';r.date='';r.fingerprint='';save();render()}
async function makeAIDraft(dim){
 const arr=dim==='ALL'?CRITERIA:CRITERIA.filter(c=>c.dim===dim);
 const criteria=arr.map(c=>{const a=get(c);return {code:c.code,name:c.name,score:a.score||'',proof:a.proof||'',finding:a.finding||'',evidence:a.evidence||'',kpi:a.kpi||'',recommendation:a.recommendation||'',applicable:a.applicable||'yes',financial:a.financial||''}});
 try{
  const response=await fetch('/api/ai/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dimension:({Finansije:'F',Operacije:'O',Planiranje:'P',Ljudi:'L',Upravljanje:'M',ALL:'ALL'}[dim]||dim),criteria,financial_effects:effects()})});
  const data=await response.json();if(!response.ok)throw Error(data.detail||'AI servis nije dostupan');
  const r=reviewRecord(dim);r.draft=data.draft;r.edited=data.draft;r.status='draft';r.reviewer='';r.date='';r.fingerprint='';save();render();
  mvNotify('AI nacrt je pripremljen. Provjerite sve tvrdnje i uredite tekst prije odobravanja.');
 }catch(e){mvNotify('AI nacrt nije kreiran: '+e.message+'\nMožete koristiti analizu po pravilima.',true);}
}
async function approveReview(dim){const na=(dim==='ALL'?CRITERIA:CRITERIA.filter(c=>c.dim===dim)).filter(c=>get(c).applicable==='no');if(na.some(c=>{const a=get(c),reason=String(a.na_reason||a.evidence||'').trim();return reason.length<20||reason.split(/\s+/).length<4||String(a.na_approved_by||'').trim().length<2}))return mvNotify('N/P zahtijeva konkretan razlog i imenovanu potvrdu konsultanta.',true);let r=reviewRecord(dim),arr=dim==='ALL'?CRITERIA:CRITERIA.filter(c=>c.dim===dim),s=summary(arr);if(!r.edited.trim())return mvNotify('Prvo pripremite nacrt.',true);if(!s.done)return mvNotify('Prije odobravanja završite sve primjenjive kriterije.',true);if(!await mvConfirm('Odobriti isključivo INTERNI SIMULACIJSKI izvještaj? Ovo nije validacija stvarnih dokaza.',{title:'Odobri demo',okLabel:'Odobri'}))return;r.status='approved_demo';r.reviewer='Interni demonstracijski pregled';r.date=new Date().toISOString();r.fingerprint=reviewFingerprint(dim);save();render()}

async function importJSON(file){
 if(!file)return;
 try{
  if(file.size>5*1024*1024)throw Error('Datoteka je prevelika (maksimalno 5 MB).');
  const raw=JSON.parse(await file.text());
  if(!raw||!Array.isArray(raw.companies)||!raw.companies.length||raw.companies.length>500)throw Error('Neispravna struktura kopije.');
  for(const c of raw.companies){
   if(!c||typeof c.id!=='string'||!c.company||typeof c.company.name!=='string'||!Array.isArray(c.diagnostics)||!c.diagnostics.length)throw Error('Neispravan profil kompanije.');
   for(const d of c.diagnostics){if(!d||typeof d.id!=='string'||!d.assess||typeof d.assess!=='object'||!Array.isArray(d.plan))throw Error('Neispravna dijagnostika.');}
  }
  if(!await mvConfirm('Uvoz će zamijeniti sve lokalne podatke. Prvo izvezite postojeću kopiju. Nastaviti?',{title:'Uvoz JSON kopije',okLabel:'Uvezi',danger:true}))return;
  workspace=raw;syncState();save();page='workspace';render();mvNotify('Sigurnosna kopija je uvezena.');
 }catch(e){mvNotify('Uvoz nije uspio: '+e.message,true)}
}

let v3Result=null,v3Busy=false,v3Error='',v3Source='',v3Owner=null;
const V3_TICKET='mevan_v3_job';
// Završena analiza se čuva u dijagnostici (state.v3), pa ostaje nakon odlaska sa stranice i sinhronizuje se na server.
function syncV3(force){
 const diagnostic=activeDiagnostic();
 if(v3Owner===diagnostic.id&&!force)return;
 if(v3Owner!==diagnostic.id)v3Error='';
 v3Owner=diagnostic.id;

function v3Ticket(){try{const t=JSON.parse(localStorage.getItem(V3_TICKET)||'null');return t&&t.job&&Date.now()-t.at<25*60*1000?t:null}catch(e){return null}}

// Čeka rezultat pozadinskog posla i upisuje ga u dijagnostiku za koju je analiza pokrenuta.
async function v3Collect(ticket){
 const readJson=async reply=>{try{return await reply.json()}catch(e){throw Error('Server nije vratio ispravan odgovor (HTTP '+reply.status+'). Servis je zauzet ili se ponovo pokreće; pokušajte ponovo za minutu.')}};
 let obj=null;
 for(let attempt=0;attempt<140&&!obj;attempt++){
  await new Promise(resolve=>setTimeout(resolve,attempt?3000:800));
  const poll=await fetch('/api/v3/analyze/job/'+encodeURIComponent(ticket.job));
  const state=await readJson(poll);if(!poll.ok)throw Error(state.detail||'Analiza nije dostupna');
  if(state.status==='error')throw Error(state.detail||'Analiza nije dostupna');
  if(state.status==='done')obj=state.result;
 }
 if(!obj)throw Error('Analiza traje duže od sedam minuta. Pokušajte ponovo.');
 if(!obj.analysis||!obj.facts||!Array.isArray(obj.criteria))throw Error('Nepotpuna analiza');
 const target=v3Diagnostic(ticket.diagnostic);
 if(!target)throw Error('Dijagnostika za koju je analiza pokrenuta više ne postoji.');
 target.v3={result:obj,source:ticket.signature,saved_at:new Date().toISOString()};
 save();
}
async function v3Wait(ticket){
 v3Busy=true;v3Error='';render();
 try{await v3Collect(ticket)}catch(e){v3Error=e.message}
 finally{localStorage.removeItem(V3_TICKET);v3Busy=false;syncV3(true);render()}
}
async function runV3(){
 v3Busy=true;v3Error='';v3Result=null;page='v2';render();
 let ticket=null;
 try{
  const body=analysisInput(),signature=analysisSignature(body);
  // Analiza ide kao pozadinski posao: AI poziv može trajati duže nego što mreža drži jedan zahtjev otvorenim.
  const started=await fetch('/api/v3/analyze/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let reply;try{reply=await started.json()}catch(e){throw Error('Server nije vratio ispravan odgovor (HTTP '+started.status+'). Servis je zauzet ili se ponovo pokreće; pokušajte ponovo za minutu.')}
  if(!started.ok)throw Error(reply.detail||'Analiza nije dostupna');
  // Oznaka posla se pamti u pregledniku: ako se stranica zatvori, rezultat se preuzima pri povratku.
  ticket={job:reply.job,diagnostic:activeDiagnostic().id,signature,at:Date.now()};
  localStorage.setItem(V3_TICKET,JSON.stringify(ticket));
 }catch(e){v3Error=e.message;v3Busy=false;syncV3(true);render();return}
 await v3Wait(ticket);
}

 let html=`<div class="panel"><h1>Integrisana analiza (AI)</h1><button class="btn secondary" onclick="openDiagnosticReview()">Konsultantska provjera i završni izvještaji</button><p class="warning">Radni nacrt. AI zaključci nisu nezavisno verificirani. Simulirani dokazi nisu stvarne potvrde; potrebna je stručna revizija prije upotrebe kod klijenta.</p><div class="row"><button class="btn" onclick="runV3()" ${v3Busy?'disabled':''}>${v3Busy?'Analiza u toku…':'Pokreni kompletnu dijagnostiku'}</button>${r?'<button class="btn secondary" onclick="exportV3(false)">Word · Executive Summary</button><button class="btn secondary" onclick="exportV3(true)">Word · Detaljni izvještaj</button><button class="btn" onclick="openV3ProjectCandidates()">Pređi na izbor operativnog projekta</button>':''}</div>${v3Error?'<p class="warning">'+esc(v3Error)+'</p>':''}${savedNote}</div>`;

}

// AI servis: izbor servisa i vlastiti API ključ. Ključ se šalje samo pri čuvanju i server ga nikad ne vraća.
let aiSettings=null;
async function aiRequest(method,path,body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'HTTP '+r.status);return data}
function aiProviderChanged(){const id=document.getElementById('aiProvider').value,p=((aiSettings&&aiSettings.providers)||[]).find(x=>x.id===id)||{};document.getElementById('aiBaseWrap').hidden=id!=='compatible';document.getElementById('aiModel').placeholder=p.model_hint||''}
function renderAiSettings(){
 const s=aiSettings,select=document.getElementById('aiProvider');if(!s||!select)return;
 select.replaceChildren(...s.providers.map(p=>new Option(p.label,p.id)));select.value=s.provider;
 document.getElementById('aiModel').value=s.model||'';document.getElementById('aiBase').value=s.base_url||'';document.getElementById('aiKey').value='';aiProviderChanged();
 const label=(s.providers.find(p=>p.id===s.provider)||{}).label||s.provider;
 document.getElementById('aiStatus').textContent=s.source==='app'?'Aktivno: '+label+' · model '+s.model+' · ključ završava na …'+s.key_hint
  :s.source==='environment'?'Aktivno: ključ iz postavki servera · model '+s.model+'. Ključ unesen ovdje ima prednost.'
  :'AI servis nije podešen. Analiza po pravilima radi i bez ključa.';
}
async function loadAiSettings(){if(!document.getElementById('aiSettings'))return;try{aiSettings=await aiRequest('GET','/api/ai/settings');renderAiSettings()}catch(e){const n=document.getElementById('aiStatus');if(n)n.textContent='Postavke AI servisa nisu učitane: '+e.message}}
async function saveAiSettings(){const v=id=>document.getElementById(id).value.trim();try{aiSettings=await aiRequest('PUT','/api/ai/settings',{provider:v('aiProvider'),model:v('aiModel'),base_url:v('aiBase'),api_key:v('aiKey')});renderAiSettings();mvNotify('AI postavke su sačuvane. Provjerite vezu prije prve upotrebe.')}catch(e){mvNotify('AI postavke nisu sačuvane: '+e.message,true)}}
async function testAiConnection(){if(document.getElementById('aiKey').value.trim())return mvNotify('Prvo sačuvajte postavke, pa provjerite vezu.',true);try{const r=await aiRequest('POST','/api/ai/test');mvNotify('Veza radi. Model: '+r.model+'.')}catch(e){mvNotify('Provjera veze nije uspjela: '+e.message,true)}}
async function removeAiKey(){if(!await mvConfirm('Ukloniti sačuvani API ključ i postavke AI servisa?',{title:'Ukloni ključ',okLabel:'Ukloni',danger:true}))return;try{aiSettings=await aiRequest('DELETE','/api/ai/settings');renderAiSettings();mvNotify('Ključ je uklonjen.')}catch(e){mvNotify('Ključ nije uklonjen: '+e.message,true)}}
async function mevanRestoreBackup(){
 const f=document.getElementById('mevan-restore-file').files[0];if(!f)return mvNotify('Odaberite JSON sigurnosnu kopiju.',true);
 if(!await mvConfirm('Vraćanje će PREPISATI sve trenutno spremljene podatke. Nastaviti?',{title:'Vraćanje sigurnosne kopije',okLabel:'Nastavi',danger:true}))return;
 const confirmation=await mvAsk('Za potvrdu upišite: VRATI-PODATKE','',{title:'Vraćanje sigurnosne kopije',okLabel:'Vrati podatke',danger:true});if(confirmation!=='VRATI-PODATKE')return;
 const r=await fetch('/api/backup/restore',{method:'POST',headers:{'Content-Type':'application/json','X-MEVAN-Confirm-Restore':'VRATI-PODATKE'},body:await f.text()});
 if(!r.ok)return mvNotify('Vraćanje nije uspjelo: '+(await r.text()).slice(0,180),true);mvNotify('Podaci vraćeni. Stranica će se ponovo učitati.');setTimeout(()=>location.reload(),1500);
}
